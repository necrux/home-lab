---
- name: Check whether cert-manager is installed.
  ansible.builtin.command:
    cmd: >-
      {{ helm_install_path }} list
      --namespace {{ operators_cert_manager_namespace }}
      --filter ^{{ operators_cert_manager_release_name }}$
      --output json
  register: operators_cert_manager_status
  changed_when: false
  failed_when: false

- name: Determine installed cert-manager chart version.
  ansible.builtin.set_fact:
    operators_cert_manager_installed_version: >-
      {{
        (operators_cert_manager_status.stdout | from_json)[0].chart
        | regex_replace('^.*-', '')
      }}
  when:
    - operators_cert_manager_status.rc == 0
    - (operators_cert_manager_status.stdout | from_json) | length > 0

- name: Determine whether cert-manager needs to be installed or updated.
  ansible.builtin.set_fact:
    operators_cert_manager_needs_update: >-
      {{
        operators_cert_manager_status.rc != 0 or
        (operators_cert_manager_status.stdout | from_json | length) == 0 or
        operators_cert_manager_installed_version != operators_cert_manager_chart_version
      }}

- name: Install or update cert-manager.
  ansible.builtin.command:
    cmd: >-
      {{ helm_install_path }} upgrade --install
      {{ operators_cert_manager_release_name }}
      oci://quay.io/jetstack/charts/cert-manager
      --namespace {{ operators_cert_manager_namespace }}
      --create-namespace
      --version {{ operators_cert_manager_chart_version }}
      --set crds.enabled=true
  register: operators_cert_manager_install
  when:
    - operators_install_cert_manager
    - operators_cert_manager_needs_update
  changed_when: true

- name: Wait for cert-manager controller to become ready.
  ansible.builtin.command:
    cmd: >-
      {{ kubectl_install_path }} wait
      --namespace {{ operators_cert_manager_namespace }}
      --for=condition=Available
      --timeout={{ operators_cert_manager_wait_timeout }}
      deployment/cert-manager
  when: operators_install_cert_manager
  changed_when: false

- name: Wait for cert-manager webhook to become ready.
  ansible.builtin.command:
    cmd: >-
      {{ kubectl_install_path }} wait
      --namespace {{ operators_cert_manager_namespace }}
      --for=condition=Available
      --timeout={{ operators_cert_manager_wait_timeout }}
      deployment/cert-manager-webhook
  when: operators_install_cert_manager
  changed_when: false

- name: Wait for cert-manager cainjector to become ready.
  ansible.builtin.command:
    cmd: >-
      {{ kubectl_install_path }} wait
      --namespace {{ operators_cert_manager_namespace }}
      --for=condition=Available
      --timeout={{ operators_cert_manager_wait_timeout }}
      deployment/cert-manager-cainjector
  when: operators_install_cert_manager
  changed_when: false

- name: Uninstall cert-manager.
  ansible.builtin.command:
    cmd: >-
      {{ helm_install_path }} uninstall
      {{ operators_cert_manager_release_name }}
      --namespace {{ operators_cert_manager_namespace }}
  when:
    - not operators_install_cert_manager
    - operators_cert_manager_status.rc == 0
    - (operators_cert_manager_status.stdout | from_json | length) > 0