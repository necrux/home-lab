---
- name: Ensure Gateway API configuration directory exists.
  ansible.builtin.file:
    path: /etc/kind/gateway
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Envoy GatewayClass.
  ansible.builtin.template:
    src: gatewayclass.yaml.j2
    dest: /etc/kind/gateway/gatewayclass.yaml
    owner: root
    group: root
    mode: "0644"

- name: Configure EnvoyProxy.
  ansible.builtin.template:
    src: envoyproxy.yaml.j2
    dest: /etc/kind/gateway/envoyproxy.yaml
    owner: root
    group: root
    mode: "0644"

- name: Configure home Gateway.
  ansible.builtin.template:
    src: gateway.yaml.j2
    dest: /etc/kind/gateway/gateway.yaml
    owner: root
    group: root
    mode: "0644"

- name: Check for GatewayClass changes.
  ansible.builtin.command:
    cmd: >-
      {{ kubectl_install_path }} diff
      -f /etc/kind/gateway/gatewayclass.yaml
  register: operators_gatewayclass_diff
  changed_when: false
  failed_when: operators_gatewayclass_diff.rc > 1

- name: Apply Envoy GatewayClass.
  ansible.builtin.command:
    cmd: >-
      {{ kubectl_install_path }} apply
      -f /etc/kind/gateway/gatewayclass.yaml
  when: operators_gatewayclass_diff.rc == 1
  changed_when: true

- name: Check for EnvoyProxy changes.
  ansible.builtin.command:
    cmd: >-
      {{ kubectl_install_path }} diff
      -f /etc/kind/gateway/envoyproxy.yaml
  register: operators_envoyproxy_diff
  changed_when: false
  failed_when: operators_envoyproxy_diff.rc > 1

- name: Apply EnvoyProxy.
  ansible.builtin.command:
    cmd: >-
      {{ kubectl_install_path }} apply
      -f /etc/kind/gateway/envoyproxy.yaml
  when: operators_envoyproxy_diff.rc == 1
  changed_when: true

- name: Check for Gateway changes.
  ansible.builtin.command:
    cmd: >-
      {{ kubectl_install_path }} diff
      -f /etc/kind/gateway/gateway.yaml
  register: operators_gateway_diff
  changed_when: false
  failed_when: operators_gateway_diff.rc > 1

- name: Apply home Gateway.
  ansible.builtin.command:
    cmd: >-
      {{ kubectl_install_path }} apply
      -f /etc/kind/gateway/gateway.yaml
  when: operators_gateway_diff.rc == 1
  changed_when: true