# Operators
## For operators in my home-lab setting the corresponding install
## variable to 'false' will uninstall the software if it exists.

# Envoy Gateway
operators_install_envoy_gateway: true
operators_envoy_gateway_namespace: "envoy-gateway-system"
operators_envoy_gateway_release: "envoy-gateway"
operators_envoy_gateway_chart_version: "1.9.1"
operators_envoy_gateway_wait_timeout: "5m"

## Gateway API
operators_gateway_class_name: "envoy-gateway"
operators_gateway_namespace: "default"
operators_gateway_name: "home-gateway"

## Envoy Gateway proxy configuration
operators_envoy_proxy_name: "home-gateway-proxy"
operators_envoy_proxy_namespace: "default"

## HTTP listener
operators_gateway_http_port: 80

## Expose Envoy HTTP through the Kind node.
operators_envoy_http_node_port: 30080
operators_envoy_https_node_port: 30443

# AWX
operators_install_awx: true
operators_awx_namespace: "ansible"
operators_awx_operator_release: "awx-operator"
operators_awx_chart_version: "3.2.1"
operators_awx_name: "awx"
operators_awx_service_type: "ClusterIP"
operators_awx_hostname: "awx.necrux.com"
operators_awx_service_name: "awx-service"
operators_awx_service_port: 80

# ArgoCD
operators_install_argocd: false
operators_argocd_namespace: "argocd"
operators_argocd_release: "argocd"
operators_argocd_chart_version: "10.9.2"
operators_argocd_name: "argocd"
operators_argocd_hostname: "argocd.necrux.com"
operators_argocd_service_name: "argocd-server"
operators_argocd_service_port: 80
operators_argocd_admin_secret_name: "argocd-initial-admin-secret"

# cert-manager
operators_install_cert_manager: true
operators_cert_manager_namespace: "cert-manager"
operators_cert_manager_release_name: "cert-manager"
operators_cert_manager_chart_version: "v1.21.2"
operators_cert_manager_wait_timeout: "5m"

## Private CA
operators_cert_manager_ca_namespace: "cert-manager"
operators_cert_manager_ca_issuer_name: "home-lab-selfsigned"
operators_cert_manager_ca_name: "home-lab-ca"
operators_cert_manager_ca_secret_name: "home-lab-ca"
operators_cert_manager_ca_common_name: "Home Lab Root CA"
operators_cert_manager_ca_duration: "87600h"
operators_cert_manager_ca_renew_before: "720h"

## Private CA issuer
operators_cert_manager_cluster_issuer_name: "home-lab-ca"

## AWX Certificate
operators_awx_certificate_name: "awx"
operators_awx_certificate_secret_name: "awx-tls"
operators_awx_certificate_namespace: "{{ operators_gateway_namespace }}"
operators_awx_certificate_duration: "2160h"
operators_awx_certificate_renew_before: "720h"

## ArgoCD Certificate
operators_argocd_certificate_name: "argocd"
operators_argocd_certificate_secret_name: "argocd-tls"
operators_argocd_certificate_namespace: "{{ operators_gateway_namespace }}"
operators_argocd_certificate_duration: "2160h"
operators_argocd_certificate_renew_before: "720h"