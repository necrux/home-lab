---
# Architecture
kind_supported_architectures:
  x86_64: amd64
  aarch64: arm64

# Docker
kind_docker_package_state: present
kind_docker_service_state: started
kind_docker_service_enabled: true

# Kubernetes
kind_kubernetes_version: "1.34.0"

# Kind
kind_version: "v0.33.0"
kind_install_path: "/usr/local/bin/kind"
kind_node_image: "kindest/node:v{{ kind_kubernetes_version }}"
kind_cluster_name: "kind"
kind_provider: "docker"
kind_wait_timeout: "5m"
kind_create_cluster: true
kind_config_enabled: true
kind_config_path: "/etc/kind/config.yaml"

# kubectl
kind_install_kubectl: true
kubectl_version: "v{{ kind_kubernetes_version }}"
kubectl_install_path: "/usr/local/bin/kubectl"

# Helm
kind_install_helm: true
helm_version: "v3.18.6"
helm_install_path: "/usr/local/bin/helm"
